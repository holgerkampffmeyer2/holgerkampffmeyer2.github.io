name: Deploy Astro to GitHub Pages

on:
  push:
    branches: ['main']
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'README*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  # pnpm-Version ist in package.json als packageManager gepinnt. Corepack
  # installiert beim ersten Aufruf genau diese Version, deshalb genuegt hier
  # 'corepack enable' -- kein 'corepack prepare' mit zusaetzlicher Versionsangabe.
  #
  # Build job: fetches Mixcloud data, builds site, generates SEO artifacts.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Fetch Mixcloud data
        run: node scripts/fetch-mixcloud.mjs --force

      - name: Build Astro site
        run: pnpm run build

      - name: Generate RSS & Sitemap
        run: pnpm run build:seo

      - name: Smoke test dist/
        run: node scripts/smoke-dist.mjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  # TypeScript check - runs in parallel with build
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: TypeScript check
        run: pnpm run check

  # Linting - runs in parallel with build and check
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint
        run: pnpm run lint

  # Unit tests - runs in parallel with build, check, and lint
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Unit tests
        run: pnpm test:run

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, check, lint, test]
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment